        const myFamilies = getFilteredFamilies();
        const total = myBelievers.length;
        const totalFamilies = myFamilies.length;

        // Attendance rate (for selected Sunday)
        let attendanceRate = '0%';
        const dayRecord = attendance[selectedSunday];
        if (dayRecord && total > 0) {
            let present = 0;
            myBelievers.forEach(b => {
                if (dayRecord[b.id]) present++;
            });
            attendanceRate = `${Math.round((present / total) * 100)}%`;
        }

        // Bible Study Plan rate
        let studyRate = '0%';
        if (total > 0) {
            const completed = myBelievers.filter(b => b.studyCompleted).length;
            studyRate = `${Math.round((completed / total) * 100)}%`;
        }

        return { total, totalFamilies, attendanceRate, studyRate };

        addAuditLog(`${name} switched session profile.`);
    };

        const newFam = {
            id,
            name: formFamilyName,
            subPriestId: formFamilyPastor,
            location: formFamilyLocation

        saveAllToStorage({ families: updated });

                                                <h5 style={{fontSize:'13px', fontWeight:600, color:'rgba(255,255,255,0.7)', textDecoration:'line-through'}}>{t.title}</h5>
                                                <p style={{fontSize:'11px', color:'var(--color-text-muted)'}}>{t.desc}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>
                )}

                {/* TAB: BIBLE STUDY PLANS */}
                {activeTab === 'growth' && (
                    <section className="tab-content active">
                        <div style={{display:'grid', gridTemplateColumns:'1.5fr 2.5fr', gap:'24px'}}>
                            <div className="card glass-card">
                                <div className="card-header" style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
                                    <h3 className="card-title">Study Programs</h3>
                                    {isSuper && (
                                        <button onClick={() => addStudyDialogRef.current.showModal()} className="btn btn-outline btn-sm">
                                            New Plan
                                        </button>
                                    )}
                                </div>
                                <div className="card-body" style={{display:'flex', flexDirection:'column', gap:'12px'}}>
                                    {studyPlans.map((plan, index) => (
                                        <div key={plan.id} onClick={() => setSelectedStudyIndex(index)} className={`menu-item ${selectedStudyIndex === index ? 'active' : ''}`} style={{cursor:'pointer', padding:'12px 14px', background:'rgba(255,255,255,0.01)', border:'1px solid rgba(255,255,255,0.05)', borderRadius:'10px', display:'flex', flexDirection:'column', alignItems:'flex-start', gap:'4px'}}>
                                            <span style={{fontSize:'13px', fontWeight:700, color:'#fff'}}>{plan.title}</span>
                                            <span style={{fontSize:'10px', color:'var(--color-gold)'}}>{plan.scripture}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {currentPlan && (
                                <div style={{display:'flex', flexDirection:'column', gap:'20px'}}>
                                    <div className="card glass-card">
                                        <div className="card-header">
                                            <div>
                                                <h3 className="card-title text-indigo" style={{fontSize:'20px', color:'var(--color-gold)'}}>{currentPlan.title}</h3>
                                                <span style={{fontSize:'12px', color:'var(--color-text-muted)'}}>Focus Verse: {currentPlan.scripture}</span>
                                            </div>
                                        </div>
                                        <div className="card-body">
                                            <div style={{padding:'14px', background:'rgba(0,0,0,0.3)', borderRadius:'12px', border:'1px solid rgba(255,255,255,0.05)', marginBottom:'16px'}}>
                                                <p style={{fontSize:'13px', lineHeight:'1.6', color:'var(--color-text-primary)'}}>{currentPlan.content}</p>
                                            </div>
                                            <div style={{padding:'12px', borderLeft:'3px solid var(--color-cyan)', background:'var(--color-cyan-glow)', borderRadius:'4px'}}>
                                                <strong style={{fontSize:'11px', textTransform:'uppercase', color:'var(--color-cyan)', display:'block', marginBottom:'4px'}}>Spiritual Action Plan:</strong>
                                                <p style={{fontSize:'12px', color:'#fff'}}>{currentPlan.action}</p>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="card glass-card">
                                        <div className="card-header">
                                            <h3 className="card-title">Plan Completion Tracker ({getActivePastorName()})</h3>
                                            <p className="card-subtitle text-muted">Toggle check to log study module readings</p>
                                        </div>
                                        <div className="card-body" style={{display:'flex', flexDirection:'column', gap:'10px'}}>
                                            {getFilteredBelievers().map(b => (
                                                <div key={b.id} style={{display:'flex', justifyContent:'space-between', alignItems:'center', padding:'8px 12px', background:'rgba(255,255,255,0.01)', border:'1px solid rgba(255,255,255,0.04)', borderRadius:'8px'}}>
                                                    <div>
                                                        <span style={{fontSize:'13px', fontWeight:600}}>{b.name}</span>
                                                        <span style={{fontSize:'10px', color:'var(--color-text-muted)', display:'block'}}>{b.role || 'Independent'} • District: {b.location}</span>
                                                    </div>
                                                    <input type="checkbox" checked={b.studyCompleted} onChange={(e) => toggleDiscipleshipReadings(b.id, e.target.checked)} style={{cursor:'pointer', width:'16px', height:'16px'}} />
                                                </div>
                                            ))}
                                            {getFilteredBelievers().length === 0 && <p className="text-muted">No parishioners found in district.</p>}
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </section>
                )}

                {/* TAB: ATTENDANCE */}
                {activeTab === 'attendance' && (
                    <section className="tab-content active">
                        <div className="card glass-card" style={{marginBottom:'24px', padding:'16px'}}>
                            <div style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
                                <div style={{display:'flex', alignItems:'center', gap:'12px'}}>
                                    <span style={{fontSize:'13px', fontWeight:600, color:'var(--color-gold)'}}>SELECT SUNDAY ASSEMBLY:</span>
                                    <select value={selectedSunday} onChange={(e) => setSelectedSunday(e.target.value)} style={{background:'var(--color-card-bg)', color:'#fff', border:'1px solid var(--color-card-border)', padding:'6px 12px', borderRadius:'8px', outline:'none', cursor:'pointer', fontSize:'13px'}}>
                                        <option value="2026-06-14">June 14, 2026</option>
                                        <option value="2026-06-07">June 07, 2026</option>
                                        <option value="2026-05-31">May 31, 2026</option>
                                        <option value="2026-05-24">May 24, 2026</option>
                                    </select>
                                </div>
                                <span className="badge badge-green" style={{fontSize:'12px', padding:'6px 12px'}}>Attendance Rate: {stats.attendanceRate}</span>
                            </div>
                        </div>

                        <div className="card glass-card">
                            <div className="card-header">
                                <h3 className="card-title">Parishioners Attendance Checklist</h3>
                                <p className="card-subtitle text-muted">Sunday roll call check for active parishioners</p>
                            </div>
                            <div className="card-body" style={{display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(260px, 1fr))', gap:'16px'}}>
                                {getFilteredBelievers().map(b => {
                                    const isPresent = !!(attendance[selectedSunday] && attendance[selectedSunday][b.id]);
                                    return (
                                        <div key={b.id} style={{display:'flex', justifyContent:'space-between', alignItems:'center', padding:'12px', background: isPresent ? 'rgba(52,211,153,0.03)' : 'rgba(255,255,255,0.01)', border: isPresent ? '1px solid rgba(52,211,153,0.15)' : '1px solid rgba(255,255,255,0.04)', borderRadius:'10px', transition:'all 0.2s'}}>
                                            <div>
                                                <span style={{fontSize:'13px', fontWeight:700, color: isPresent ? 'var(--color-green)' : '#fff'}}>{b.name}</span>
                                                <span style={{fontSize:'10px', color:'var(--color-text-muted)', display:'block'}}>{b.location} • {b.role || 'Independent'}</span>
                                            </div>
                                            <input type="checkbox" checked={isPresent} onChange={(e) => toggleAttendanceCheckbox(b.id, e.target.checked)} style={{cursor:'pointer', width:'18px', height:'18px'}} />
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </section>
                )}
            </main>

            {/* MODALS */}
            <dialog ref={addFamilyDialogRef} className="glass-dialog">
                <div className="dialog-header">
                    <h3>Register New Parish Family Group</h3>
                    <button className="btn-close" onClick={() => addFamilyDialogRef.current.close()}>&times;</button>
                </div>
                <form onSubmit={handleAddFamily} className="card-body" style={{display:'flex', flexDirection:'column', gap:'16px'}}>
                    <div className="form-group">
                        <label>Family Surname / Group Name *</label>
                        <input type="text" value={formFamilyName} onChange={(e) => setFormFamilyName(e.target.value)} placeholder="E.g., Miller Family" required />
                    </div>
                    <div className="form-group">
                        <label>Assigned Assistant Pastor *</label>
                        <select value={formFamilyPastor} onChange={(e) => setFormFamilyPastor(e.target.value)} required>
                            {clergy.map(c => (
                                <option key={c.id} value={c.id}>{c.name}</option>
                            ))}
                        </select>
                    </div>
                    <div className="form-group">
                        <label>District Territory *</label>
                        <select value={formFamilyLocation} onChange={(e) => setFormFamilyLocation(e.target.value)} required>
                            <option value="North District">North District</option>
                            <option value="East District">East District</option>
                            <option value="South District">South District</option>
                        </select>
                    </div>
                    <div className="dialog-actions">
                        <button type="button" className="btn btn-outline btn-sm" onClick={() => addFamilyDialogRef.current.close()}>Cancel</button>
                        <button type="submit" className="btn btn-primary btn-sm">Add Family Group</button>
                    </div>
                </form>
            </dialog>

            <dialog ref={addMemberDialogRef} className="glass-dialog" style={{maxWidth:'650px'}}>
                <div className="dialog-header">
                    <h3>Register New Believer / Parishioner</h3>
                    <button className="btn-close" onClick={() => addMemberDialogRef.current.close()}>&times;</button>
                </div>
                <form onSubmit={handleAddMember} className="card-body" style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'16px'}}>
                    <div className="form-group" style={{gridColumn:'span 2'}}>
                        <label>Full Name *</label>
                        <input type="text" value={formMemberName} onChange={(e) => setFormMemberName(e.target.value)} placeholder="Full Name" required />
                    </div>
                    <div className="form-group">
                        <label>Gender *</label>
                        <select value={formMemberGender} onChange={(e) => setFormMemberGender(e.target.value)} required>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>
                    <div className="form-group">
                        <label>Phone Number</label>
                        <input type="tel" value={formMemberPhone} onChange={(e) => setFormMemberPhone(e.target.value)} placeholder="+1 (555) 000-0000" />
                    </div>
                    <div className="form-group">
                        <label>Email Address</label>
                        <input type="email" value={formMemberEmail} onChange={(e) => setFormMemberEmail(e.target.value)} placeholder="email@example.com" />
                    </div>
                    <div className="form-group">
                        <label>Residence Address</label>
                        <input type="text" value={formMemberAddress} onChange={(e) => setFormMemberAddress(e.target.value)} placeholder="Street Address" />
                    </div>
                    <div className="form-group">
                        <label>District Territory *</label>
                        <select value={formMemberLocation} onChange={(e) => setFormMemberLocation(e.target.value)} required>
                            <option value="North District">North District</option>
                            <option value="East District">East District</option>
                            <option value="South District">South District</option>
                        </select>
                    </div>
                    <div className="form-group">
                        <label>Assigned Assistant Pastor *</label>
                        <select value={formMemberPastor} onChange={(e) => setFormMemberPastor(e.target.value)} required>
                            {clergy.map(c => (
                                <option key={c.id} value={c.id}>{c.name}</option>
                            ))}
                        </select>
                    </div>
                    <div className="form-group">
                        <label>Parish Family Group (Optional)</label>
                        <select value={formMemberFamily} onChange={(e) => setFormMemberFamily(e.target.value)}>
                            <option value="">-- No Family Group --</option>
                            {families.map(f => (
                                <option key={f.id} value={f.id}>{f.name}</option>
                            ))}
                        </select>
                    </div>
                    <div className="form-group">
                        <label>Family Role / Relationship (Optional)</label>
                        <input type="text" value={formMemberRole} onChange={(e) => setFormMemberRole(e.target.value)} placeholder="Father, Mother, Son, Newcomer..." />
                    </div>
                    <div className="form-group">
                        <label>Baptism Status *</label>
                        <select value={formMemberBaptism} onChange={(e) => setFormMemberBaptism(e.target.value)} required>
                            <option value="Baptized">Water Baptized</option>
                            <option value="Non-Baptized">Non-Baptized</option>
                        </select>
                    </div>
                    <div className="form-group">
                        <label>Former Religion Denomination</label>
                        <input type="text" value={formMemberReligion} onChange={(e) => setFormMemberReligion(e.target.value)} placeholder="E.g., Baptist, Catholic, None" />
                    </div>
                    <div className="form-group" style={{gridColumn:'span 2'}}>
                        <label>Active Prayer Need / Request Summary</label>
                        <input type="text" value={formMemberPrayer} onChange={(e) => setFormMemberPrayer(e.target.value)} placeholder="Prayer point summary..." />
                    </div>
                    <div className="dialog-actions" style={{gridColumn:'span 2', marginTop:'8px'}}>
                        <button type="button" className="btn btn-outline btn-sm" onClick={() => addMemberDialogRef.current.close()}>Cancel</button>
                        <button type="submit" className="btn btn-primary btn-sm">Register Believer</button>
                    </div>
                </form>
            </dialog>

            <dialog ref={assignTaskDialogRef} className="glass-dialog">
                <div className="dialog-header">
                    <h3>Delegate Roster Care Task</h3>
                    <button className="btn-close" onClick={() => assignTaskDialogRef.current.close()}>&times;</button>
                </div>
                <form onSubmit={handleAddTask} className="card-body" style={{display:'flex', flexDirection:'column', gap:'16px'}}>
                    <div className="form-group">
                        <label>Duty Title *</label>
                        <input type="text" value={formTaskTitle} onChange={(e) => setFormTaskTitle(e.target.value)} placeholder="E.g., Visit sick child" required />
                    </div>
                    <div className="form-group">
                        <label>Duty Description Details</label>
                        <textarea value={formTaskDesc} onChange={(e) => setFormTaskDesc(e.target.value)} placeholder="Describe details..." style={{height:'80px', resize:'none'}}></textarea>
                    </div>
                    <div className="form-group">
                        <label>Assign To (Staff Pastor) *</label>
                        <select value={formTaskPastor} onChange={(e) => setFormTaskPastor(e.target.value)} required>
                            {clergy.map(c => (
                                <option key={c.id} value={c.id}>{c.name}</option>
                            ))}
                        </select>
                    </div>
                    <div className="form-group">
                        <label>Select Target Parishioner (Optional)</label>
                        <select value={formTaskBeliever} onChange={(e) => setFormTaskBeliever(e.target.value)}>
                            <option value="">-- No Specific Parishioner --</option>
                            {believers.map(b => (
                                <option key={b.id} value={b.id}>{b.name}</option>
                            ))}
                        </select>
                    </div>
                    <div className="form-group">
                        <label>Urgency Priority *</label>
                        <select value={formTaskUrgency} onChange={(e) => setFormTaskUrgency(e.target.value)} required>
                            <option value="Standard">Standard</option>
                            <option value="Urgent">Urgent</option>
                            <option value="Critical">Critical</option>
                        </select>
                    </div>
                    <div className="dialog-actions">
                        <button type="button" className="btn btn-outline btn-sm" onClick={() => assignTaskDialogRef.current.close()}>Cancel</button>
                        <button type="submit" className="btn btn-primary btn-sm">Assign Task</button>
                    </div>
                </form>
            </dialog>

            <dialog ref={addStudyDialogRef} className="glass-dialog">
                <div className="dialog-header">
                    <h3>Create Discipleship Lesson Plan</h3>
                    <button className="btn-close" onClick={() => addStudyDialogRef.current.close()}>&times;</button>
                </div>
                <form onSubmit={handleAddStudyPlan} className="card-body" style={{display:'flex', flexDirection:'column', gap:'16px'}}>
                    <div className="form-group">
                        <label>Plan Title *</label>
                        <input type="text" value={formStudyTitle} onChange={(e) => setFormStudyTitle(e.target.value)} placeholder="E.g., Living in Faith" required />
                    </div>
                    <div className="form-group">
                        <label>Focus Scripture Verse *</label>
                        <input type="text" value={formStudyScripture} onChange={(e) => setFormStudyScripture(e.target.value)} placeholder="E.g., Hebrews 11:1" required />
                    </div>
                    <div className="form-group">
                        <label>Lesson Reading Content *</label>
                        <textarea value={formStudyContent} onChange={(e) => setFormStudyContent(e.target.value)} placeholder="Outline details..." style={{height:'100px', resize:'none'}} required></textarea>
                    </div>
                    <div className="form-group">
                        <label>Action Challenge Verse / Exercise *</label>
                        <input type="text" value={formStudyAction} onChange={(e) => setFormStudyAction(e.target.value)} placeholder="E.g., Morning prayer commitment." required />
                    </div>
                    <div className="dialog-actions">
                        <button type="button" className="btn btn-outline btn-sm" onClick={() => addStudyDialogRef.current.close()}>Cancel</button>
                        <button type="submit" className="btn btn-primary btn-sm">Create Program</button>
                    </div>
                </form>
            </dialog>
        </div>
    );
}

// Render React App
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>
</body>
</html>
