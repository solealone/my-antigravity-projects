<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Changer Prophetical Church | Mobile App</title>
    <!-- Google Fonts: Outfit & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bg: #000000;
            --color-surface: rgba(12, 12, 16, 0.7);
            --color-card: rgba(12, 12, 16, 0.7);
            --color-surface-hover: rgba(255, 255, 255, 0.08);
            --color-primary: #8b5cf6; /* Neon Violet */
            --color-secondary: rgba(255, 255, 255, 0.03);
            --color-gold: #fbbf24; 
            --color-gold-glow: rgba(251, 191, 36, 0.15);
            --color-indigo-muted: rgba(139, 92, 246, 0.12);
            --color-green: #34d399; /* Neon Green */
            --color-green-muted: rgba(52, 211, 153, 0.15);
            --color-red: #ef4444; /* Neon Red */
            --color-red-muted: rgba(239, 68, 68, 0.15);
            --color-text: #ffffff;
            --color-text-muted: #94a3b8;
            --color-border: rgba(139, 92, 246, 0.25);
            --font-display: 'Outfit', sans-serif;
            --font-sans: 'Inter', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #000000;
            color: var(--color-text);
            font-family: var(--font-sans);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 20px;
        }

        /* Simulator Container */
        .simulator-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        /* Top Simulation Bar (Controls outside the phone) */
        .simulation-controls {
            background-color: rgba(18, 18, 20, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid var(--color-border);
            padding: 8px 16px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.8), 0 0 15px rgba(139, 92, 246, 0.1);
            z-index: 100;
        }

        .control-label {
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--color-gold);
        }

        .role-selector {
            background-color: #000;
            border: 1px solid var(--color-border);
            color: var(--color-text);
            padding: 4px 10px;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
        }

        /* Desktop Smartphone Frame Simulator */
        .simulator-wrapper {
            position: relative;
            width: 390px;
            height: 844px;
            background: #000000;
            border: 10px solid #1a1a1d;
            border-radius: 44px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.95),
                        0 0 30px rgba(139, 92, 246, 0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Screen notches */
        .simulator-bezel {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 28px;
            background: #1a1a1d;
            border-bottom-left-radius: 18px;
            border-bottom-right-radius: 18px;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 4px;
        }

        .simulator-speaker {
            width: 40px;
            height: 3px;
            background: #111;
            border-radius: 2px;
        }

        /* App Content */
        .phone-screen {
            width: 100%;
            height: 100%;
            background-color: #000000;
            background-image: 
                radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(34, 211, 238, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.08) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(251, 191, 36, 0.08) 0px, transparent 50%);
            display: flex;
            flex-direction: column;
            position: relative;
            padding-top: 28px;
            padding-bottom: 8px;
        }

        /* Scrollable area */
        .scrollable-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            scrollbar-width: none;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .scrollable-content::-webkit-scrollbar {
            display: none;
        }

        /* App Header */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px 12px 16px;
            border-bottom: 1px solid rgba(139, 92, 246, 0.2);
            background-color: rgba(5, 5, 5, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 100;
        }

        .app-logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .app-logo svg {
            color: var(--color-gold);
            filter: drop-shadow(0 0 4px rgba(251,191,36,0.3));
        }

        .app-logo span {
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 1.15rem;
            letter-spacing: 0.5px;
        }

        .profile-bubble {
            display: flex;
            align-items: center;
            gap: 6px;
            background-color: rgba(255, 255, 255, 0.03);
            padding: 4px 10px;
            border-radius: 16px;
            border: 1px solid var(--color-border);
        }

        .profile-avatar {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background-color: var(--color-primary);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 8px;
            font-weight: 700;
        }

        .profile-name {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--color-text);
        }

        /* Bottom Tab Navigation */
        .bottom-nav {
            height: 64px;
            background-color: rgba(5, 5, 5, 0.98);
            border-top: 1px solid rgba(139, 92, 246, 0.2);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: 6px;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: var(--color-text-muted);
            cursor: pointer;
            width: 20%;
            transition: all 0.2s ease;
        }

        .nav-item svg {
            transition: transform 0.2s ease;
        }

        .nav-item span {
            font-size: 0.65rem;
            font-weight: 600;
        }

        .nav-item.active {
            color: var(--color-gold);
            text-shadow: 0 0 8px rgba(251, 191, 36, 0.5);
        }

        .nav-item.active svg {
            transform: scale(1.15);
            color: var(--color-gold);
            filter: drop-shadow(0 0 6px rgba(251, 191, 36, 0.5));
        }

        /* Page Layout & Titles */
        .page-section {
            display: none;
            flex-direction: column;
            gap: 14px;
            animation: slideUp 0.25s cubic-bezier(0.1, 0.76, 0.55, 0.94);
        }

        .page-section.active {
            display: flex;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .page-header-group {
            margin-bottom: 2px;
        }

        .page-title {
            font-family: var(--font-display);
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--color-text);
            letter-spacing: -0.2px;
        }

        .page-subtitle {
            font-size: 0.75rem;
            color: var(--color-text-muted);
            margin-top: 1px;
        }

        /* Card and Panel Designs */
        .card {
            background: rgba(12, 12, 16, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.08) 0%, transparent 70%);
            opacity: 0.5;
            transform: translate(20%, -20%);
            pointer-events: none;
        }

        .card:active {
            transform: scale(0.98);
            border-color: rgba(139, 92, 246, 0.3);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            font-family: var(--font-display);
            font-size: 0.95rem;
            font-weight: 800;
            background: linear-gradient(90deg, #ffffff, var(--color-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-title svg {
            color: var(--color-gold);
            filter: drop-shadow(0 0 4px var(--color-gold-glow));
        }

        .card-subtitle {
            font-size: 0.7rem;
            color: var(--color-text-muted);
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .stat-card {
            background: rgba(12, 12, 16, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        
        .stat-card::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.08) 0%, transparent 70%);
            opacity: 0.5;
            transform: translate(20%, -20%);
            pointer-events: none;
        }

        .stat-card:active {
            transform: scale(0.96);
            border-color: rgba(139, 92, 246, 0.3);
        }

        .stat-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .stat-icon.gold { background-color: var(--color-gold-muted); color: var(--color-gold); }
        .stat-icon.indigo { background-color: var(--color-indigo-muted); color: var(--color-primary); }
        .stat-icon.green { background-color: var(--color-green-muted); color: var(--color-green); }
        .stat-icon.red { background-color: var(--color-red-muted); color: var(--color-red); }

        .stat-info {
            display: flex;
            flex-direction: column;
        }

        .stat-val {
            font-family: var(--font-display);
            font-size: 1.15rem;
            font-weight: 800;
        }

        .stat-lbl {
            font-size: 0.65rem;
            color: var(--color-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.3px;
            font-weight: 600;
        }

        /* List Headers */
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
        }

        .list-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--color-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .list-action-btn {
            background: none;
            border: none;
            color: var(--color-primary);
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            outline: none;
        }

        /* Task Cards */
        .task-item {
            background-color: #1a191d;
            border: 1px solid var(--color-border);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: border-color 0.2s;
        }

        .task-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .task-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--color-text);
        }

        .urgency-badge {
            font-size: 0.6rem;
            font-weight: 800;
            padding: 1px 5px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .urgency-badge.urgent { background-color: var(--color-red-muted); color: var(--color-red); }
        .urgency-badge.standard { background-color: var(--color-indigo-muted); color: var(--color-primary); }

        .task-desc {
            font-size: 0.75rem;
            color: var(--color-text-muted);
            line-height: 1.35;
        }

        .task-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
            border-top: 1px dashed rgba(255,255,255,0.05);
            padding-top: 8px;
        }

        .task-assignee {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            color: var(--color-text-muted);
        }

        .mini-avatar {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background-color: var(--color-secondary);
            font-size: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-weight: 700;
        }

        .task-complete-btn {
            background-color: var(--color-green-muted);
            color: var(--color-green);
            border: 1px solid rgba(52,211,153,0.2);
            border-radius: 6px;
            padding: 3px 8px;
            font-size: 0.65rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .task-complete-btn:active {
            transform: scale(0.95);
        }

        /* Toggle Sub-tabs */
        .sub-tab-bar {
            display: flex;
            background-color: var(--color-surface);
            border: 1px solid var(--color-border);
            padding: 3px;
            border-radius: 10px;
        }

        .sub-tab-item {
            flex: 1;
            text-align: center;
            padding: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--color-text-muted);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .sub-tab-item.active {
            background-color: var(--color-secondary);
            color: var(--color-text);
        }

        /* Inputs */
        .search-container {
            position: relative;
            width: 100%;
        }

        .search-input {
            width: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 8px 12px 8px 30px;
            color: var(--color-text);
            font-size: 0.8rem;
            outline: none;
            transition: all 0.2s ease;
            box-shadow: inset 1px 1px 4px rgba(0, 0, 0, 0.5), inset -1px -1px 4px rgba(255, 255, 255, 0.01);
        }

        .search-input:focus { 
            border-color: var(--color-primary); 
            box-shadow: inset 1px 1px 3px rgba(0, 0, 0, 0.5), 0 0 8px rgba(139, 92, 246, 0.25);
            background-color: rgba(10, 10, 15, 0.6);
        }

        .search-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--color-text-muted);
            pointer-events: none;
        }

        /* Expandable family card */
        .family-card {
            background-color: var(--color-card);
            border: 1px solid var(--color-border);
            border-radius: 12px;
            overflow: hidden;
        }

        .family-header {
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .family-title {
            font-size: 0.85rem;
            font-weight: 700;
        }

        .family-meta {
            font-size: 0.7rem;
            color: var(--color-text-muted);
            margin-top: 1px;
        }

        .family-details {
            display: none;
            padding: 10px 12px 12px 12px;
            background-color: rgba(255,255,255,0.01);
            border-top: 1px solid var(--color-border);
            flex-direction: column;
            gap: 6px;
        }

        .family-details.active { display: flex; }

        .believer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.02);
        }

        .believer-row:last-child { border-bottom: none; padding-bottom: 0; }

        .believer-info-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .believer-name { font-size: 0.8rem; font-weight: 500; }
        .believer-role { font-size: 0.65rem; color: var(--color-text-muted); background-color: rgba(255,255,255,0.04); padding: 1px 4px; border-radius: 4px; }
        .badge-baptism { font-size: 0.6rem; font-weight: 800; padding: 1px 4px; border-radius: 4px; text-transform: uppercase; }
        .badge-baptism.baptized { background-color: var(--color-green-muted); color: var(--color-green); }
        .badge-baptism.unbaptized { background-color: var(--color-red-muted); color: var(--color-red); }

        /* Pastor Workloads */
        .pastor-workload-card {
            background-color: var(--color-card);
            border: 1px solid var(--color-border);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .pastor-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pastor-name { font-size: 0.85rem; font-weight: 700; }
        .pastor-role { font-size: 0.7rem; color: var(--color-gold); font-weight: 600; }

        .workload-bar-container {
            width: 100%;
            height: 6px;
            background-color: var(--color-secondary);
            border-radius: 3px;
            overflow: hidden;
        }

        .workload-bar {
            height: 100%;
            background-color: var(--color-primary);
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        .workload-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.65rem;
            color: var(--color-text-muted);
        }

        /* Buttons */
        .btn {
            background-color: var(--color-primary);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 4px 10px rgba(139, 92, 246, 0.2);
        }

        .btn:active { transform: scale(0.97); }
        .btn-outline { 
            background-color: transparent; 
            border: 1px solid rgba(139, 92, 246, 0.25); 
            color: var(--color-text); 
            box-shadow: none;
        }
        .btn-outline:hover { background-color: rgba(255,255,255,0.03); }
        .btn-primary { 
            background: linear-gradient(135deg, var(--color-primary), #6d28d9); 
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.4), inset 1px 1px 2px rgba(255,255,255,0.2), inset -1px -1px 2px rgba(0,0,0,0.4); 
            border: 1px solid rgba(139, 92, 246, 0.3);
        }
        .btn-primary:hover { opacity: 0.95; }
        .btn-gold { 
            background: linear-gradient(135deg, var(--color-gold), #d97706); 
            color: #000; 
            box-shadow: 0 0 10px rgba(251, 191, 36, 0.4), inset 1px 1px 2px rgba(255,255,255,0.3), inset -1px -1px 2px rgba(0,0,0,0.4); 
        }
        .btn-gold:hover { opacity: 0.95; }

        .floating-action-bar {
            margin-top: auto;
            display: flex;
            gap: 8px;
        }

        /* Bottom Sheet Form */
        .bottom-sheet-backdrop {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .bottom-sheet-backdrop.active { display: block; opacity: 1; }

        .bottom-sheet {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--color-surface);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            border-top: 1px solid var(--color-border);
            padding: 16px 20px 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transform: translateY(100%);
            transition: transform 0.25s cubic-bezier(0.1, 0.76, 0.55, 0.94);
            z-index: 1001;
            max-height: 80%;
            overflow-y: auto;
        }

        .bottom-sheet.active { transform: translateY(0); }

        .sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--color-border);
            padding-bottom: 8px;
        }

        .sheet-title { font-family: var(--font-display); font-size: 1rem; font-weight: 800; }
        .sheet-close { background: none; border: none; color: var(--color-text-muted); font-size: 1.2rem; cursor: pointer; outline: none; }

        .form-group { display: flex; flex-direction: column; gap: 4px; }
        .form-label { font-size: 0.7rem; font-weight: 700; color: var(--color-text-muted); text-transform: uppercase; }
        .form-control {
            background-color: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 8px 10px;
            color: var(--color-text);
            font-size: 0.8rem;
            outline: none;
