                setStudyPlans(seedPlans);
                setAttendance(seedAttendance);
                setAnnouncements(seedAnnouncements);
                setAuditLogsList(seedAuditLogs);

                localStorage.setItem('sanctus_clergy', JSON.stringify(seedClergy));
                localStorage.setItem('sanctus_families', JSON.stringify(seedFamilies));
                localStorage.setItem('sanctus_believers', JSON.stringify(seedBelievers));
                localStorage.setItem('sanctus_tasks', JSON.stringify(seedTasks));
                localStorage.setItem('sanctus_study_plans', JSON.stringify(seedPlans));
                localStorage.setItem('sanctus_attendance', JSON.stringify(seedAttendance));
                localStorage.setItem('sanctus_announcements', JSON.stringify(seedAnnouncements));
                localStorage.setItem('sanctus_auditlogs', JSON.stringify(seedAuditLogs));
                localStorage.setItem('sanctus_currentuser', 'thomas');
            };

            useEffect(() => {
                loadState();
                const handleStorage = () => {
                    loadState();
                };
                window.addEventListener('storage', handleStorage);
                return () => window.removeEventListener('storage', handleStorage);
            }, []);

            useEffect(() => {
                if (currentUser === 'thomas') {
                    document.body.className = 'is-super';
                } else {
                    document.body.className = 'is-pastor';
                }
            }, [currentUser]);

            const activeClergyId = currentUser === 'joseph' ? 'p1' : (currentUser === 'matthew' ? 'p2' : 'p3');

            // Default visit believer when list changes
            useEffect(() => {
                if (currentUser !== 'thomas') {
                    const list = believers.filter(b => b.subPriestId === activeClergyId);
                    if (list.length > 0) {
                        setFormVisitBeliever(list[0].id);
                    } else {
                        setFormVisitBeliever('');
                    }
                }
            }, [currentUser, believers]);

            const saveFamilies = (data) => { setFamilies(data); localStorage.setItem('sanctus_families', JSON.stringify(data)); };
            const saveBelievers = (data) => { setBelievers(data); localStorage.setItem('sanctus_believers', JSON.stringify(data)); };
            const saveTasks = (data) => { setTasks(data); localStorage.setItem('sanctus_tasks', JSON.stringify(data)); };
            const saveStudyPlans = (data) => { setStudyPlans(data); localStorage.setItem('sanctus_study_plans', JSON.stringify(data)); };
            const saveAttendance = (data) => { setAttendance(data); localStorage.setItem('sanctus_attendance', JSON.stringify(data)); };
            const saveAnnouncements = (data) => { setAnnouncements(data); localStorage.setItem('sanctus_announcements', JSON.stringify(data)); };
            const saveAuditLogs = (data) => { setAuditLogsList(data); localStorage.setItem('sanctus_auditlogs', JSON.stringify(data)); };

            const getActivePastorName = () => {
                if (currentUser === 'thomas') return 'Pastor Thomas';
                const p = clergy.find(c => c.id === activeClergyId);
                return p ? p.name : 'Pastor';
            };

            const addAuditLog = (msg) => {
                const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
                const newLog = { msg, time };
                setAuditLogsList(prev => {
                    const updated = [newLog, ...prev];
                    localStorage.setItem('sanctus_auditlogs', JSON.stringify(updated));
                    return updated;
                });
            };

            const getActiveBelievers = () => {
                if (currentUser === 'thomas') return believers;
                return believers.filter(b => b.subPriestId === activeClergyId);
            };

            const getActiveFamilies = () => {
                if (currentUser === 'thomas') return families;
                return families.filter(f => f.subPriestId === activeClergyId);
            };

            const activeBelievers = getActiveBelievers();
            const activeFamilies = getActiveFamilies();

            const SundayDate = '2026-06-07';
            const dayAttendance = attendance[SundayDate] || {};
            const presentCount = activeBelievers.filter(b => dayAttendance[b.id] === true).length;
            const attendanceRate = activeBelievers.length > 0 ? Math.round((presentCount / activeBelievers.length) * 100) : 0;

            const studyCount = activeBelievers.filter(b => b.studyCompleted).length;
            const studyRate = activeBelievers.length > 0 ? Math.round((studyCount / activeBelievers.length) * 100) : 0;

            const submitAddMember = (e) => {
                e.preventDefault();
                if (!formMemberName.trim()) {
                    alert('Please fill name field.');
                    return;
                }
                const newId = 'b_' + Date.now();
                const subPriestId = currentUser === 'thomas' ? formMemberPastor : activeClergyId;
                const newBeliever = {
                    id: newId,
                    name: formMemberName,
                    gender: formMemberGender,
                    email: 'N/A',
                    phone: 'N/A',
                    address: 'N/A',
                    location: currentUser === 'thomas' ? 'North District' : (clergy.find(c => c.id === subPriestId)?.district || 'North District'),
                    dateJoined: new Date().toISOString().split('T')[0],
                    religion: 'None',
                    baptism: formMemberBaptism,
                    familyId: formMemberFamily === 'None' || !formMemberFamily ? '' : formMemberFamily,
                    role: '',
                    subPriestId,
                    prayer: formMemberPrayer || 'Spiritual growth.',
                    studyCompleted: false,
                    studyDate: null,
                    growthRate: 50
                };

                const updated = [...believers, newBeliever];
                saveBelievers(updated);
                addAuditLog(`${getActivePastorName()} registered new believer: ${formMemberName}.`);

                setFormMemberName('');
                setFormMemberPrayer('');
                setFormMemberFamily('');
                setActiveBottomSheet(null);
            };

            const submitAddFamily = (e) => {
                e.preventDefault();
                if (!formFamilyName.trim() || !formFamilyLocation.trim()) {
                    alert('Please fill out all family fields.');
                    return;
                }
                const newId = 'f_' + Date.now();
                const subPriestId = currentUser === 'thomas' ? formFamilyPastor : activeClergyId;
                const newFam = {
                    id: newId,
                    name: formFamilyName,
                    location: formFamilyLocation,
                    subPriestId
                };

                const updated = [...families, newFam];
                saveFamilies(updated);
                addAuditLog(`${getActivePastorName()} registered family group: ${formFamilyName}.`);

                setFormFamilyName('');
                setFormFamilyLocation('');
                setActiveBottomSheet(null);
            };

            const submitAddTask = (e) => {
                e.preventDefault();
                if (!formTaskTitle.trim()) {
                    alert('Please enter a task title.');
                    return;
                }
                const newId = 't_' + Date.now();
                const newTask = {
                    id: newId,
                    title: formTaskTitle,
                    desc: formTaskDesc,
                    priestId: formTaskPastor,
                    urgency: formTaskUrgency.charAt(0).toUpperCase() + formTaskUrgency.slice(1),
                    believerId: formTaskBeliever || '',
                    status: 'pending',
                    dateCreated: new Date().toISOString().split('T')[0]
                };

                const updated = [...tasks, newTask];
                saveTasks(updated);
                const assignedPastorName = clergy.find(c => c.id === formTaskPastor)?.name || 'Pastor';
                addAuditLog(`Pastor Thomas assigned task '${formTaskTitle}' to ${assignedPastorName}.`);

                setFormTaskTitle('');
                setFormTaskDesc('');
                setFormTaskBeliever('');
                setActiveBottomSheet(null);
            };

            const submitPublishStudy = (e) => {
                e.preventDefault();
                if (!formStudyTitle.trim() || !formStudyScripture.trim()) {
                    alert('Please fill details.');
                    return;
                }
                const newId = 'sp_' + Date.now();
                const newPlan = {
                    id: newId,
                    title: formStudyTitle,
                    scripture: formStudyScripture,
                    content: formStudyText,
                    action: 'Reflect on scripture and pray.'
                };

                const updatedBelievers = believers.map(b => ({
                    ...b,
                    studyCompleted: false,
                    studyDate: null
                }));

                saveBelievers(updatedBelievers);
                saveStudyPlans([...studyPlans, newPlan]);
                addAuditLog(`Pastor Thomas updated active Bible Study Plan: '${formStudyTitle}'.`);

                setFormStudyTitle('');
                setFormStudyScripture('');
                setFormStudyText('');
                setActiveBottomSheet(null);
            };

            const submitPostAnnouncement = (e) => {
                e.preventDefault();
                if (!formAnnouncementTitle.trim() || !formAnnouncementText.trim()) {
                    alert('Please enter announcement text.');
                    return;
                }
                const newId = 'a' + (announcements.length + 1);
                const newAnnounce = {
                    id: newId,
                    title: formAnnouncementTitle,
                    sender: 'Pastor Thomas',
                    text: formAnnouncementText,
                    time: 'Just now'
                };

                saveAnnouncements([newAnnounce, ...announcements]);
                addAuditLog(`Pastor Thomas broadcasted announcement: '${formAnnouncementTitle}'.`);

                setFormAnnouncementTitle('');
                setFormAnnouncementText('');
                setActiveBottomSheet(null);
            };

            const submitVisitLog = (e) => {
                e.preventDefault();
                if (!formVisitBeliever || !formVisitNote.trim()) {
                    alert('Please choose a believer and write a note.');
                    return;
                }

                const updatedBelievers = believers.map(b => {
                    if (b.id === formVisitBeliever) {
                        return { ...b, prayer: formVisitNote };
                    }
                    return b;
                });

                saveBelievers(updatedBelievers);
                const believerName = believers.find(b => b.id === formVisitBeliever)?.name || 'Believer';
                addAuditLog(`${getActivePastorName()} logged visitation note for ${believerName}: "${formVisitNote}"`);

                setFormVisitNote('');
                alert('Visitation log posted successfully to the audit trail!');
            };

            const completeTask = (taskId) => {
                const updatedTasks = tasks.map(t => {
                    if (t.id === taskId) {
                        return { ...t, status: 'completed' };
                    }
                    return t;
                });
                saveTasks(updatedTasks);
                const t = tasks.find(x => x.id === taskId);
                addAuditLog(`${getActivePastorName()} marked task '${t ? t.title : 'Task'}' as Completed.`);
            };

            const toggleStudyCheck = (believerId, checked) => {
                const updatedBelievers = believers.map(b => {
                    if (b.id === believerId) {
                        const nextCompleted = checked;
                        const nextGrowth = checked ? Math.min(100, b.growthRate + 10) : Math.max(0, b.growthRate - 10);
                        return {
                            ...b,
                            studyCompleted: nextCompleted,
                            studyDate: checked ? new Date().toISOString().split('T')[0] : null,
                            growthRate: nextGrowth
                        };
                    }
                    return b;
                });
                saveBelievers(updatedBelievers);
                const name = believers.find(b => b.id === believerId)?.name || 'Believer';
                addAuditLog(`${getActivePastorName()} updated Bible study progress for ${name}.`);
            };

            const toggleAttendance = (believerId, present) => {
                const dayRecord = { ...dayAttendance };
                dayRecord[believerId] = present;
                const updated = {
                    ...attendance,
                    [SundayDate]: dayRecord
                };
                saveAttendance(updated);
                const name = believers.find(b => b.id === believerId)?.name || 'Believer';
                addAuditLog(`${getActivePastorName()} marked ${name} as ${present ? 'Present' : 'Absent'}.`);
            };

            const changeSimulationRole = (role) => {
                setCurrentUser(role);
                localStorage.setItem('sanctus_currentuser', role);
            };

            const toggleFamilyExpand = (id) => {
                setExpandedFamilies(prev => ({ ...prev, [id]: !prev[id] }));
            };

            const activeTasks = tasks.filter(t => t.status === 'pending');
            const myActiveTasks = currentUser === 'thomas' ? activeTasks : activeTasks.filter(t => t.priestId === activeClergyId);

            // Search filtering
            const filteredDirectoryBelievers = activeBelievers.filter(b => {
                const q = directorySearch.toLowerCase();
                return b.name.toLowerCase().includes(q) || b.baptism.toLowerCase().includes(q);
            });

            const filteredDirectoryFamilies = activeFamilies.filter(f => {
                const q = directorySearch.toLowerCase();
                return f.name.toLowerCase().includes(q) || f.location.toLowerCase().includes(q);
            });

            const currentStudyPlan = studyPlans[studyPlans.length - 1] || null;

            return (
                <div className="simulator-container">
                    {/* Simulation controls toolbar */}
                    <div className="simulation-controls">
                        <span className="control-label">SIMULATOR PROFILE:</span>
                        <select className="role-selector" value={currentUser} onChange={(e) => changeSimulationRole(e.target.value)}>
                            <option value="thomas">Pr. Thomas (Super Admin)</option>
                            <option value="joseph">Pr. Joseph (Assistant Pastor)</option>
                            <option value="matthew">Pr. Matthew (Assistant Pastor)</option>
                            <option value="luke">Pr. Luke (Assistant Pastor)</option>
                        </select>
                    </div>

                    {/* Phone Shell */}
                    <div className="simulator-wrapper">
                        <div className="simulator-bezel">
                            <div className="simulator-speaker"></div>
                        </div>

                        <div className="phone-screen">
                            {/* App Header */}
                            <header className="app-header">
                                <div className="app-logo">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                        <path d="M12 2v20M5 9h14"/>
                                    </svg>
                                    <span style={{ fontSize: '12px', fontWeight: 800, lineHeight: 1.2, whiteSpace: 'normal', width: '130px' }}>
                                        Life Changer Prophetical Church
                                    </span>
                                </div>
                                <div className="profile-bubble">
                                    <div className="profile-avatar">
                                        {currentUser === 'thomas' ? 'PT' : (clergy.find(c => c.id === activeClergyId)?.avatar || 'P')}
                                    </div>
                                    <span className="profile-name">
                                        {currentUser === 'thomas' ? 'Pr. Thomas' : (clergy.find(c => c.id === activeClergyId)?.name || 'Pastor').replace('Pastor ', 'Pr. ')}
                                    </span>
                                </div>
                            </header>

                            {/* Scrollable Content */}
                            <div className="scrollable-content">
                                {/* SECTION: Dashboard */}
                                <div className={`page-section ${activeTab === 'dashboard' ? 'active' : ''}`}>
                                    <div className="page-header-group">
                                        <h2 className="page-title">Dashboard</h2>
                                        <p className="page-subtitle">
                                            {currentUser === 'thomas' ? 'Global Church Administration' : `Parish District Work - ${getActivePastorName()}`}
                                        </p>
                                    </div>

                                    {/* Stats Grid */}
                                    <div className="stats-grid">
                                        <div className="stat-card">
                                            <div className="stat-icon gold">
                                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                                                </svg>
                                            </div>
                                            <div className="stat-info">
                                                <span className="stat-val">{activeBelievers.length}</span>
                                                <span className="stat-lbl">Believers</span>
                                            </div>
                                        </div>

                                        <div className="stat-card">
                                            <div className="stat-icon indigo">
                                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
                                                </svg>
                                            </div>
                                            <div className="stat-info">
                                                <span className="stat-val">{activeFamilies.length}</span>
                                                <span className="stat-lbl">Families</span>
                                            </div>
                                        </div>

                                        <div className="stat-card">
                                            <div className="stat-icon green">
                                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
                                                </svg>
                                            </div>
                                            <div className="stat-info">
                                                <span className="stat-val">{attendanceRate}%</span>
                                                <span className="stat-lbl">Attendance</span>
                                            </div>
                                        </div>

                                        <div className="stat-card">
                                            <div className="stat-icon red">
                                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                                                </svg>
                                            </div>
                                            <div className="stat-info">
                                                <span className="stat-val">{studyRate}%</span>
                                                <span className="stat-lbl">Study Rate</span>
                                            </div>
                                        </div>
                                    </div>

                                    {/* GOVERNANCE PANEL: Tithe and Finances (Thomas-only) */}
                                    {currentUser === 'thomas' && (
                                        <div className="finance-card rbac-super">
                                            <div className="card-header">
                                                <span className="card-title">
                                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                        <rect x="2" y="4" width="20" height="16" rx="2"/><line x1="12" y1="10" x2="12" y2="10"/><path d="M22 10h-4a2 2 0 0 0-2 2v0a2 2 0 0 0 2 2h4"/>
                                                    </svg>
                                                    Governance: Tithes & Funds
                                                </span>
                                                <span style={{ fontSize: '0.6rem', color: 'var(--color-green)', fontWeight: 700 }}>Active Month</span>
                                            </div>
                                            <span className="finance-value">$14,250.00</span>
                                            <span className="card-subtitle" style={{ marginTop: '-6px' }}>Ministry Budget Distribution:</span>
                                            <div className="budget-bar-container">
                                                <div className="budget-segment admin" style={{ width: '40%' }} title="Admin"></div>
                                                <div className="budget-segment charity" style={{ width: '25%' }} title="Charity"></div>
                                                <div className="budget-segment event" style={{ width: '20%' }} title="Events"></div>
                                                <div className="budget-segment maintenance" style={{ width: '15%' }} title="Maintenance"></div>
                                            </div>
                                            <div className="budget-legend">
                                                <div className="legend-item"><div className="legend-color admin"></div><span>Admin (40%)</span></div>
                                                <div className="legend-item"><div className="legend-color charity"></div><span>Charity (25%)</span></div>
                                                <div className="legend-item"><div className="legend-color event"></div><span>Outreach (20%)</span></div>
                                                <div className="legend-item"><div className="legend-color maintenance"></div><span>Facilities (15%)</span></div>
                                            </div>
                                        </div>
                                    )}

                                    {/* GOVERNANCE PANEL: Pastor Workloads (Thomas-only) */}
                                    {currentUser === 'thomas' && (
                                        <div className="card rbac-super" style={{ gap: '8px' }}>
                                            <span className="card-title">Pastoral Load & Delegation</span>
                                            <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                                                {clergy.map(pastor => {
                                                    const activeCount = tasks.filter(t => t.priestId === pastor.id && t.status === 'pending').length;
                                                    const percentage = Math.min((activeCount / 4) * 100, 100);
                                                    return (
                                                        <div key={pastor.id} style={{ display: 'flex', flexDirection: 'column', gap: '3px' }}>
                                                            <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.75rem' }}>
                                                                <span style={{ fontWeight: 600 }}>{pastor.name}</span>
                                                                <span style={{ color: 'var(--color-text-muted)' }}>{activeCount} active task{activeCount === 1 ? '' : 's'}</span>
                                                            </div>
                                                            <div className="workload-bar-container">
                                                                <div className="workload-bar" style={{ width: `${percentage}%` }}></div>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    )}

                                    {/* PANEL: Announcements */}
                                    <div className="card">
                                        <div className="list-header">
                                            <span className="list-title">Ministry Announcements</span>
                                            {currentUser === 'thomas' && (
                                                <button className="list-action-btn rbac-super" onClick={() => setActiveBottomSheet('post-announcement')}>+ Broadcast</button>
                                            )}
                                        </div>
                                        <div style={{ display: 'flex', flexDirection: 'column', gap: '6px' }}>
                                            {announcements.map(a => (
                                                <div key={a.id} className="announcement-card">
                                                    <div className="announcement-header">
                                                        <span>From: {a.sender}</span>
                                                        <span>{a.time}</span>
                                                    </div>
                                                    <span className="announcement-title">{a.title}</span>
                                                    <p className="announcement-text">{a.text}</p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    {/* PANEL: Active Tasks List (All roles) */}
                                    <div className="item-list">
                                        <div className="list-header">
                                            <span className="list-title">
                                                {currentUser === 'thomas' ? 'Active Tasks' : 'My Assigned Tasks'}
                                            </span>
                                            <button className="list-action-btn" onClick={() => setActiveTab('pastors')}>View All</button>
                                        </div>
                                        <div className="item-list">
                                            {myActiveTasks.length === 0 ? (
                                                <p style={{ fontSize: '0.75rem', color: 'var(--color-text-muted)', textAlign: 'center', padding: '10px' }}>
                                                    No pending active tasks.
                                                </p>
                                            ) : (
                                                myActiveTasks.map(task => {
                                                    const pastor = clergy.find(c => c.id === task.priestId);
                                                    const believer = believers.find(b => b.id === task.believerId);
                                                    return (
                                                        <div key={task.id} className="task-item text-muted">
                                                            <div className="task-meta">
                                                                <span className="task-title" style={{ color: '#fff' }}>{task.title}</span>
                                                                <span className={`urgency-badge ${task.urgency.toLowerCase() === 'critical' || task.urgency.toLowerCase() === 'urgent' ? 'urgent' : 'standard'}`}>
                                                                    {task.urgency}
                                                                </span>
                                                            </div>
                                                            <p className="task-desc">{task.desc} {believer ? `(${believer.name})` : ''}</p>
                                                            <div className="task-footer">
                                                                <div className="task-assignee">
                                                                    <div className="mini-avatar">{pastor ? pastor.avatar : 'P'}</div>
                                                                    <span>{pastor ? pastor.name : 'Unassigned'}</span>
                                                                </div>
                                                                <button className="task-complete-btn" onClick={() => completeTask(task.id)}>Complete</button>
                                                            </div>
                                                        </div>
                                                    );
                                                })
                                            )}
                                        </div>
                                    </div>

                                    {/* GOVERNANCE PANEL: Global Audit Trail (Thomas-only) */}
                                    {currentUser === 'thomas' && (
                                        <div className="card rbac-super">
                                            <span className="card-title">Global Governance Audit Trail</span>
                                            <div className="audit-list">
                                                {auditLogsList.map((log, idx) => (
                                                    <div key={idx} className="audit-item">
                                                        <span className="audit-msg">{log.msg}</span>
                                                        <span className="audit-time">{log.time}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {/* STAFF PANEL: Quick Parish Visit Logger (Pastor-only) */}
                                    {currentUser !== 'thomas' && (
                                        <div className="card rbac-pastor">
                                            <span className="card-title">Quick Care Visit Log</span>
                                            <div className="form-group">
                                                <label className="form-label">Parishioner Visited</label>
                                                <select className="form-control" value={formVisitBeliever} onChange={(e) => setFormVisitBeliever(e.target.value)}>
                                                    {believers.filter(b => b.subPriestId === activeClergyId).map(b => (
                                                        <option key={b.id} value={b.id}>{b.name}</option>
                                                    ))}
                                                </select>
                                            </div>
                                            <div className="form-group">
                                                <label className="form-label">Counsel Note</label>
                                                <input 
                                                    type="text" 
                                                    className="form-control" 
                                                    value={formVisitNote} 
                                                    onChange={(e) => setFormVisitNote(e.target.value)} 
                                                    placeholder="E.g., Conducted home prayer..." 
                                                />
                                            </div>
                                            <button className="btn btn-primary" onClick={submitVisitLog}>Post Note to Log</button>
                                        </div>
                                    )}
                                </div>

                                {/* SECTION: Directory */}
                                <div className={`page-section ${activeTab === 'directory' ? 'active' : ''}`}>
                                    <div className="page-header-group">
                                        <h2 className="page-title">Directory</h2>
                                        <p className="page-subtitle">Congregational Membership Database</p>
                                    </div>

                                    {/* Sub-tabs */}
                                    <div className="sub-tab-bar">
                                        <div className={`sub-tab-item ${directorySubtab === 'families' ? 'active' : ''}`} onClick={() => setDirectorySubtab('families')}>Families</div>
                                        <div className={`sub-tab-item ${directorySubtab === 'individuals' ? 'active' : ''}`} onClick={() => setDirectorySubtab('individuals')}>Individuals</div>
                                    </div>

                                    {/* Search */}
                                    <div className="search-container">
                                        <svg className="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                                        </svg>
                                        <input 
                                            type="text" 
                                            className="search-input" 
                                            value={directorySearch} 
                                            onChange={(e) => setDirectorySearch(e.target.value)} 
                                            placeholder="Search by name, location or pastor..." 
                                        />
                                    </div>

                                    {/* List Content */}
                                    <div className="item-list">
                                        {directorySubtab === 'families' ? (
                                            filteredDirectoryFamilies.length === 0 ? (
                                                <p style={{ fontSize: '0.75rem', color: 'var(--color-text-muted)', textAlign: 'center', padding: '16px' }}>No families found.</p>
                                            ) : (
                                                filteredDirectoryFamilies.map(fam => {
                                                    const pastor = clergy.find(c => c.id === fam.subPriestId);
                                                    const members = believers.filter(b => b.familyId === fam.id);
                                                    const isExpanded = expandedFamilies[fam.id];
                                                    return (
                                                        <div key={fam.id} className="family-card" style={{ marginBottom: '8px' }}>
                                                            <div className="family-header" onClick={() => toggleFamilyExpand(fam.id)}>
                                                                <div>
                                                                    <span className="family-title">{fam.name}</span>
                                                                    <p className="family-meta">{fam.location} &bull; {pastor ? pastor.name : 'Unassigned'}</p>
                                                                </div>
                                                                <svg 
                                                                    width="14" 
                                                                    height="14" 
                                                                    viewBox="0 0 24 24" 
                                                                    fill="none" 
                                                                    stroke="currentColor" 
                                                                    strokeWidth="2"
                                                                    style={{ transform: isExpanded ? 'rotate(180deg)' : 'none', transition: 'transform 0.2s' }}
                                                                >
                                                                    <polyline points="6 9 12 15 18 9"/>
                                                                </svg>
                                                            </div>
                                                            <div className={`family-details ${isExpanded ? 'active' : ''}`}>
                                                                {members.length === 0 ? (
                                                                    <p style={{ fontSize: '0.7rem', color: 'var(--color-text-muted)', fontStyle: 'italic' }}>No registered members.</p>
                                                                ) : (
                                                                    members.map(m => (
                                                                        <div key={m.id} className="believer-row">
                                                                            <div className="believer-info-group">
                                                                                <span className="believer-name">{m.name}</span>
                                                                                <span className="believer-role">{m.role || 'Member'}</span>
                                                                            </div>
                                                                            <span className={`badge-baptism ${m.baptism === 'Baptized' ? 'baptized' : 'unbaptized'}`}>{m.baptism}</span>
                                                                        </div>
                                                                    ))
                                                                )}
                                                            </div>
                                                        </div>
                                                    );
                                                })
                                            )
                                        ) : (
                                            filteredDirectoryBelievers.length === 0 ? (
                                                <p style={{ fontSize: '0.75rem', color: 'var(--color-text-muted)', textAlign: 'center', padding: '16px' }}>No believers found.</p>
                                            ) : (
                                                filteredDirectoryBelievers.map(b => {
                                                    const fam = families.find(f => f.id === b.familyId);
                                                    return (
                                                        <div key={b.id} className="card" style={{ flexDirection: 'row', justifyContent: 'space-between', alignItems: 'center', padding: '10px 12px', gap: '8px', marginBottom: '8px' }}>
                                                            <div>
                                                                <span style={{ fontSize: '0.85rem', fontWeight: 600 }}>{b.name}</span>
                                                                <p style={{ fontSize: '0.7rem', color: 'var(--color-text-muted)' }}>{fam ? fam.name : 'Individual'}</p>
                                                            </div>
                                                            <span className={`badge-baptism ${b.baptism === 'Baptized' ? 'baptized' : 'unbaptized'}`}>{b.baptism}</span>
                                                        </div>
                                                    );
                                                })
                                            )
                                        )}
                                    </div>

                                    <div className="floating-action-bar">
                                        <button className="btn btn-outline" style={{ flex: 1 }} onClick={() => setActiveBottomSheet('add-family')}>
                                            + Add Family
                                        </button>
                                        <button className="btn btn-primary" style={{ flex: 1 }} onClick={() => setActiveBottomSheet('add-member')}>
                                            + Add Believer
                                        </button>
                                    </div>
                                </div>

                                {/* SECTION: Pastors/Tasks delegation */}
                                <div className={`page-section ${activeTab === 'pastors' ? 'active' : ''}`}>
                                    <div className="page-header-group">
                                        <h2 className="page-title">Pastors & Tasks</h2>
                                        <p className="page-subtitle">Administrative work tracking</p>
                                    </div>

                                    <div className="item-list">
                                        {clergy.map(pastor => {
                                            const activeTasksForPastor = tasks.filter(t => t.priestId === pastor.id && t.status === 'pending');
                                            const taskCount = activeTasksForPastor.length;
                                            const percentage = Math.min((taskCount / 4) * 100, 100);
                                            return (
                                                <div key={pastor.id} className="pastor-workload-card">
                                                    <div className="pastor-info">
                                                        <span className="pastor-name">{pastor.name}</span>
                                                        <span className="pastor-role">Assistant Pastor</span>
                                                    </div>
                                                    <div className="workload-bar-container">
                                                        <div className="workload-bar" style={{ width: `${percentage}%` }}></div>
                                                    </div>
                                                    <div className="workload-meta">
                                                        <span>Delegation Load</span>
                                                        <span>{taskCount} Active task{taskCount === 1 ? '' : 's'}</span>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>

                                    {currentUser === 'thomas' && (
                                        <button className="btn btn-primary rbac-super" style={{ marginTop: '4px' }} onClick={() => setActiveBottomSheet('add-task')}>
                                            + Assign Task
                                        </button>
                                    )}
                                </div>

                                {/* SECTION: Bible Study Plans */}
                                <div className={`page-section ${activeTab === 'study' ? 'active' : ''}`}>
                                    <div className="page-header-group">
                                        <h2 className="page-title">Bible Studies</h2>
                                        <p className="page-subtitle">Discipleship lesson completion metrics</p>
                                    </div>

                                    {/* Study plan display */}
                                    {currentStudyPlan && (
                                        <div className="bible-study-banner">
                                            <div className="list-header">
                                                <span className="study-title">{currentStudyPlan.title}</span>
                                                {currentUser === 'thomas' && (
                                                    <button className="list-action-btn rbac-super" style={{ color: '#000' }} onClick={() => setActiveBottomSheet('publish-study')}>Edit</button>
                                                )}
                                            </div>
                                            <span className="study-scripture">{currentStudyPlan.scripture}</span>
                                            <p className="study-text">{currentStudyPlan.content}</p>
                                        </div>
                                    )}

                                    {/* Completion check list */}
                                    <div className="item-list">
                                        <span className="list-title">Parishioner study completion</span>
                                        <div className="item-list">
                                            {activeBelievers.map(b => (
                                                <div key={b.id} className="study-checklist-item">
                                                    <label className="checkbox-container">
                                                        {b.name}
                                                        <input type="checkbox" checked={b.studyCompleted} onChange={(e) => toggleStudyCheck(b.id, e.target.checked)} />
                                                        <span className="checkmark"></span>
                                                    </label>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                {/* SECTION: Attendance logging */}
                                <div className={`page-section ${activeTab === 'attendance' ? 'active' : ''}`}>
                                    <div className="page-header-group">
                                        <h2 className="page-title">Attendance</h2>
                                        <p className="page-subtitle">Weekly church gathering logs</p>
                                    </div>

                                    <div className="card" style={{ padding: '10px 12px', gap: '4px' }}>
                                        <span style={{ fontSize: '0.8rem', fontWeight: 700, color: 'var(--color-gold)' }}>Sunday Service Tracking</span>
                                        <p style={{ fontSize: '0.7rem', color: 'var(--color-text-muted)' }}>Mark attendance records for your designated parish members.</p>
                                    </div>

                                    <div className="item-list">
                                        {activeBelievers.map(b => {
                                            const isPresent = dayAttendance[b.id] === true;
                                            return (
                                                <div key={b.id} className="attendance-row">
                                                    <span className="attendance-name">{b.name}</span>
                                                    <div className="attendance-actions">
                                                        <button className={`btn-toggle present ${isPresent ? 'active' : ''}`} onClick={() => toggleAttendance(b.id, true)}>Present</button>
                                                        <button className={`btn-toggle absent ${!isPresent ? 'active' : ''}`} onClick={() => toggleAttendance(b.id, false)}>Absent</button>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>

                            {/* Bottom Navigation Bar */}
                            <nav className="bottom-nav">
                                <div className={`nav-item ${activeTab === 'dashboard' ? 'active' : ''}`} onClick={() => setActiveTab('dashboard')}>
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                        <rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect>
                                    </svg>
                                    <span>Home</span>
                                </div>
                                <div className={`nav-item ${activeTab === 'directory' ? 'active' : ''}`} onClick={() => setActiveTab('directory')}>
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle>
                                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                                    </svg>
                                    <span>Directory</span>
                                </div>
                                <div className={`nav-item ${activeTab === 'pastors' ? 'active' : ''}`} onClick={() => setActiveTab('pastors')}>
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                        <circle cx="12" cy="12" r="4"/><path d="M16 8v5M8 8v5M12 16h.01M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                                    </svg>
                                    <span>Tasks</span>
                                </div>
                                <div className={`nav-item ${activeTab === 'study' ? 'active' : ''}`} onClick={() => setActiveTab('study')}>
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
                                    </svg>
                                    <span>Studies</span>
                                </div>
                                <div className={`nav-item ${activeTab === 'attendance' ? 'active' : ''}`} onClick={() => setActiveTab('attendance')}>
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
                                    </svg>
                                    <span>Attendance</span>
                                </div>
                            </nav>
                        </div>
                    </div>

                    {/* SHEET: Add Member */}
                    <div className={`bottom-sheet-backdrop ${activeBottomSheet === 'add-member' ? 'active' : ''}`} onClick={() => setActiveBottomSheet(null)}>
                        <div className={`bottom-sheet ${activeBottomSheet === 'add-member' ? 'active' : ''}`} onClick={(e) => e.stopPropagation()}>
                            <div className="sheet-header">
                                <span className="sheet-title">Add Believer</span>
                                <button className="sheet-close" onClick={() => setActiveBottomSheet(null)}>&times;</button>
                            </div>
                            <form onSubmit={submitAddMember}>
                                <div className="form-group">
                                    <label className="form-label">Full Name</label>
                                    <input 
                                        type="text" 
                                        className="form-control" 
                                        value={formMemberName} 
                                        onChange={(e) => setFormMemberName(e.target.value)} 
                                        placeholder="John Doe" 
                                    />
                                </div>
                                <div className="form-row">
                                    <div className="form-group" style={{ flex: 1 }}>
                                        <label className="form-label">Gender</label>
                                        <select className="form-control" value={formMemberGender} onChange={(e) => setFormMemberGender(e.target.value)}>
                                            <option value="Male">Male</option>
                                            <option value="Female">Female</option>
                                        </select>
                                    </div>
                                    <div className="form-group" style={{ flex: 1 }}>
                                        <label className="form-label">Baptism Status</label>
                                        <select className="form-control" value={formMemberBaptism} onChange={(e) => setFormMemberBaptism(e.target.value)}>
                                            <option value="Baptized">Baptized</option>
                                            <option value="Unbaptized">Unbaptized</option>
                                        </select>
                                    </div>
                                </div>
                                <div className="form-group">
                                    <label className="form-label">Family Group</label>
                                    <select className="form-control" value={formMemberFamily} onChange={(e) => setFormMemberFamily(e.target.value)}>
                                        <option value="">None (Individual Believer)</option>
                                        {activeFamilies.map(fam => (
                                            <option key={fam.id} value={fam.id}>{fam.name}</option>
                                        ))}
                                    </select>
                                </div>
                                {currentUser === 'thomas' && (
                                    <div className="form-group rbac-super">
                                        <label className="form-label">Assigned Assistant Pastor</label>
                                        <select className="form-control" value={formMemberPastor} onChange={(e) => setFormMemberPastor(e.target.value)}>
                                            {clergy.map(c => (
                                                <option key={c.id} value={c.id}>{c.name}</option>
                                            ))}
                                        </select>
                                    </div>
                                )}
                                <div className="form-group" style={{ marginBottom: '16px' }}>
                                    <label className="form-label">Prayer Needs</label>
                                    <input 
                                        type="text" 
                                        className="form-control" 
                                        value={formMemberPrayer} 
                                        onChange={(e) => setFormMemberPrayer(e.target.value)} 
                                        placeholder="Job search, healing, strength..." 
                                    />
                                </div>
                                <button type="submit" className="btn btn-primary" style={{ width: '100%' }}>Create Member Entry</button>
                            </form>
                        </div>
                    </div>

                    {/* SHEET: Add Family */}
                    <div className={`bottom-sheet-backdrop ${activeBottomSheet === 'add-family' ? 'active' : ''}`} onClick={() => setActiveBottomSheet(null)}>
                        <div className={`bottom-sheet ${activeBottomSheet === 'add-family' ? 'active' : ''}`} onClick={(e) => e.stopPropagation()}>
                            <div className="sheet-header">
                                <span className="sheet-title">Register Family Group</span>
                                <button className="sheet-close" onClick={() => setActiveBottomSheet(null)}>&times;</button>
                            </div>
                            <form onSubmit={submitAddFamily}>
                                <div className="form-group">
                                    <label className="form-label">Family Surname</label>
                                    <input 
                                        type="text" 
                                        className="form-control" 
                                        value={formFamilyName} 
                                        onChange={(e) => setFormFamilyName(e.target.value)} 
                                        placeholder="E.g., Smith Family" 
                                    />
                                </div>
                                <div className="form-group">
                                    <label className="form-label">Location / Area</label>
                                    <input 
                                        type="text" 
                                        className="form-control" 
                                        value={formFamilyLocation} 
                                        onChange={(e) => setFormFamilyLocation(e.target.value)} 
                                        placeholder="E.g., West District" 
                                    />
                                </div>
                                {currentUser === 'thomas' && (
                                    <div className="form-group rbac-super">
                                        <label className="form-label">Assigned Pastor</label>
                                        <select className="form-control" value={formFamilyPastor} onChange={(e) => setFormFamilyPastor(e.target.value)}>
                                            {clergy.map(c => (
                                                <option key={c.id} value={c.id}>{c.name}</option>
                                            ))}
                                        </select>
                                    </div>
                                )}
                                <button type="submit" className="btn btn-primary" style={{ width: '100%', marginTop: '8px' }}>Register Family</button>
                            </form>
                        </div>
                    </div>

                    {/* SHEET: Add Task */}
                    <div className={`bottom-sheet-backdrop ${activeBottomSheet === 'add-task' ? 'active' : ''}`} onClick={() => setActiveBottomSheet(null)}>
                        <div className={`bottom-sheet ${activeBottomSheet === 'add-task' ? 'active' : ''}`} onClick={(e) => e.stopPropagation()}>
                            <div className="sheet-header">
                                <span className="sheet-title">Assign Pastoral Task</span>
                                <button className="sheet-close" onClick={() => setActiveBottomSheet(null)}>&times;</button>
                            </div>
                            <form onSubmit={submitAddTask}>
                                <div className="form-group">
                                    <label className="form-label">Task Action Title</label>
                                    <input 
                                        type="text" 
                                        className="form-control" 
                                        value={formTaskTitle} 
                                        onChange={(e) => setFormTaskTitle(e.target.value)} 
                                        placeholder="Home Counseling Visitation" 
                                    />
                                </div>
                                <div className="form-group">
                                    <label className="form-label">Task Description</label>
                                    <input 
                                        type="text" 
                                        className="form-control" 
                                        value={formTaskDesc} 
                                        onChange={(e) => setFormTaskDesc(e.target.value)} 
                                        placeholder="Offer support for family health issues..." 
                                    />
                                </div>
                                <div className="form-row">
                                    <div className="form-group" style={{ flex: 1 }}>
                                        <label className="form-label">Assign To</label>
                                        <select className="form-control" value={formTaskPastor} onChange={(e) => setFormTaskPastor(e.target.value)}>
                                            {clergy.map(c => (
                                                <option key={c.id} value={c.id}>{c.name}</option>
                                            ))}
                                        </select>
                                    </div>
                                    <div className="form-group" style={{ flex: 1 }}>
                                        <label className="form-label">Urgency</label>
                                        <select className="form-control" value={formTaskUrgency} onChange={(e) => setFormTaskUrgency(e.target.value)}>
                                            <option value="standard">Standard</option>
                                            <option value="urgent">Urgent</option>
                                        </select>
                                    </div>
                                </div>
                                <div className="form-group" style={{ marginBottom: '16px' }}>
                                    <label className="form-label">Parish Believer Linked</label>
                                    <select className="form-control" value={formTaskBeliever} onChange={(e) => setFormTaskBeliever(e.target.value)}>
                                        <option value="">None (General Administrative Task)</option>
                                        {believers.map(b => (
                                            <option key={b.id} value={b.id}>{b.name}</option>
                                        ))}
                                    </select>
                                </div>
                                <button type="submit" className="btn btn-primary" style={{ width: '100%' }}>Assign Task</button>
                            </form>
                        </div>
                    </div>

                    {/* SHEET: Publish Study */}
                    <div className={`bottom-sheet-backdrop ${activeBottomSheet === 'publish-study' ? 'active' : ''}`} onClick={() => setActiveBottomSheet(null)}>
                        <div className={`bottom-sheet ${activeBottomSheet === 'publish-study' ? 'active' : ''}`} onClick={(e) => e.stopPropagation()}>
                            <div className="sheet-header">
                                <span className="sheet-title">Modify Bible Study Plan</span>
                                <button className="sheet-close" onClick={() => setActiveBottomSheet(null)}>&times;</button>
                            </div>
                            <form onSubmit={submitPublishStudy}>
                                <div className="form-group">
                                    <label className="form-label">Lesson Title</label>
                                    <input 
                                        type="text" 
                                        className="form-control" 
                                        value={formStudyTitle} 
                                        onChange={(e) => setFormStudyTitle(e.target.value)} 
                                        placeholder="Faith in Action" 
                                    />
                                </div>
                                <div className="form-group">
                                    <label className="form-label">Scripture Reference</label>
                                    <input 
                                        type="text" 
                                        className="form-control" 
                                        value={formStudyScripture} 
                                        onChange={(e) => setFormStudyScripture(e.target.value)} 
                                        placeholder="Hebrews 11:1-6" 
                                    />
                                </div>
                                <div className="form-group" style={{ marginBottom: '16px' }}>
                                    <label className="form-label">Commentary Outline</label>
                                    <textarea 
                                        className="form-control" 
                                        value={formStudyText} 
                                        onChange={(e) => setFormStudyText(e.target.value)} 
                                        rows="3" 
                                        placeholder="Discussing the foundational properties of trust..." 
                                    />
                                </div>
                                <button type="submit" className="btn btn-primary" style={{ width: '100%' }}>Publish Study Plan</button>
                            </form>
                        </div>
                    </div>

                    {/* SHEET: Post Announcement */}
                    <div className={`bottom-sheet-backdrop ${activeBottomSheet === 'post-announcement' ? 'active' : ''}`} onClick={() => setActiveBottomSheet(null)}>
                        <div className={`bottom-sheet ${activeBottomSheet === 'post-announcement' ? 'active' : ''}`} onClick={(e) => e.stopPropagation()}>
                            <div className="sheet-header">
                                <span className="sheet-title">Broadcast Announcement</span>
                                <button className="sheet-close" onClick={() => setActiveBottomSheet(null)}>&times;</button>
                            </div>
                            <form onSubmit={submitPostAnnouncement}>
                                <div className="form-group">
                                    <label className="form-label">Announcement Title</label>
                                    <input 
                                        type="text" 
                                        className="form-control" 
                                        value={formAnnouncementTitle} 
                                        onChange={(e) => setFormAnnouncementTitle(e.target.value)} 
                                        placeholder="Special Ministry Update" 
                                    />
                                </div>
                                <div className="form-group">
                                    <label className="form-label">Broadcaster / From</label>
                                    <input type="text" className="form-control" value="Pastor Thomas" readOnly />
                                </div>
                                <div className="form-group" style={{ marginBottom: '16px' }}>
                                    <label className="form-label">Message Details</label>
                                    <textarea 
                                        className="form-control" 
                                        value={formAnnouncementText} 
                                        onChange={(e) => setFormAnnouncementText(e.target.value)} 
                                        rows="3" 
                                        placeholder="Write message for assistant pastors and staffs..." 
                                    />
                                </div>
                                <button type="submit" className="btn btn-primary" style={{ width: '100%' }}>Broadcast Update</button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
