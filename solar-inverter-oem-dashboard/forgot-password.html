<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Solar OEM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .login-card {
            background: white;
            border: 2px solid #000;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            padding: 40px;
            box-shadow: 4px 4px 0px 0px #000;
            text-align: center;
        }

        .icon-circle {
            width: 60px;
            height: 60px;
            background: #f1f5f9;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            border: 1px solid #000;
        }

        .title {
            font-size: 1.5rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #1e293b;
        }

        .form-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: #000;
            outline: none;
        }

        .btn-black {
            width: 100%;
            padding: 14px;
            background: #000;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .btn-black:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .back-link {
            display: block;
            margin-top: 25px;
            font-size: 0.9rem;
            color: #64748b;
            text-decoration: none;
            font-weight: 500;
        }

        .back-link:hover {
            color: #000;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="icon-circle">
            <i class="ph ph-lock-key-open" style="font-size: 1.5rem;"></i>
        </div>

        <div class="title">Forgot Password?</div>
        <div class="subtitle">No worries, we'll send you reset instructions.</div>

        <form>
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-input" placeholder="Enter your email">
            </div>

            <button type="button" class="btn-black" onclick="alert('Reset link sent!')">Send Reset Link</button>
        </form>

        <a href="login.html" class="back-link">
            <i class="ph ph-arrow-left"></i> Back to Login
        </a>
    </div>

</body>

</html>
