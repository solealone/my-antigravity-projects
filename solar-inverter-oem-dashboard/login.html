<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Solar OEM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .login-card {
            background: white;
            border: 2px solid #000;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            padding: 40px;
            box-shadow: 4px 4px 0px 0px #000;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-icon {
            font-size: 3rem;
            color: #000;
            margin-bottom: 10px;
        }

        .brand-text {
            font-size: 1.5rem;
            font-weight: 800;
            color: #000;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #1e293b;
        }

        .form-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            /* Fix width overflow */
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: #000;
            outline: none;
        }

        .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: #64748b;
        }

        .forgot-link {
            font-size: 0.9rem;
            color: #0f172a;
            font-weight: 600;
            text-decoration: none;
        }

        .btn-black {
            width: 100%;
            padding: 14px;
            background: #000;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .btn-black:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .signup-text {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
            color: #64748b;
        }

        .signup-link {
            color: #000;
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="brand-header">
            <i class="ph ph-solar-panel brand-icon"></i>
            <div class="brand-text">Solar<span style="color:#64748b;">OEM</span></div>
            <p style="color:#64748b; margin-top:5px; font-size:0.9rem;">Super Admin Portal</p>
        </div>

        <form action="index.html">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-input" placeholder="admin@solaroem.com" value="admin@solaroem.com">
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" class="form-input" placeholder="••••••••" value="password123">
            </div>

            <div class="form-actions">
                <label class="remember-me">
                    <input type="checkbox"> Remember me
                </label>
                <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
            </div>

            <button type="button" class="btn-black" onclick="window.location.href='index.html'">Sign In</button>
        </form>

        <div class="signup-text">
            New Dealer? <a href="#" class="signup-link">Apply for Access</a>
        </div>
    </div>

</body>

</html>
